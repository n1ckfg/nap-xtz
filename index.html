		<script type="text/javascript">
			"use strict";

			// The NAPLPS unit screen is 1 wide with a 4:3 aspect ratio, so only
			// y in [0, 0.75] is visible.
			const UNIT_HEIGHT = 0.75;

			let recording = true;
			let c;
			//let gif;
			let posCounterX = 0;
			let posCounterY = 0;

			let player = null;

			let scaleFactor = 1;

			// Slideshow mode: toggled on by the "slideshow" link. While active it
			// plays a random .nap from ./images every slideshow_interval seconds.
			// Loading specific content or entering live drawing stops it.
			let slideshow_interval = 10; // seconds
			let slideshowActive = false;
			let liveDrawingActive = false;
			let slideshowPlayTimer = null; // interval between slides
			// Fallback list (used if ./images/nap-list.json fails to load).
			let napFiles = [
			    "output_20260222_181752.nap", "output_20260222_181957.nap",
			    "output_20260222_181616.nap", "output_20260222_181140.nap",
			    "output_20260222_181729.nap", "output_20260222_181558.nap",
			    "output_20260222_181503.nap"
			];

			let dropZone;
			let sW = 640;
			let sH = 480;

			let defaultFont;

			let preview, explanation, explanationbg;
			//let shark, skull, santa, beer, haunt, email, mouse;

			let isMobile = false;

			// Plays a decoded command array into an offscreen buffer with
			// progressive vertex-by-vertex draw-on. Every shape advances one
			// vertex per TelidonP5.PROGRESSIVE_DRAW_INTERVAL (66 ms) until
			// maxPoints is reached; WAIT commands and BLINK palette animations
			// continue to advance on the same clock.
			class NapPlayer {

				constructor(data, w, h) {
					this.commands = NAPLPS.decode(data).commands;
					this.pg = createGraphics(w, h);
					this.pg.pixelDensity(1);
					// A palette animation keeps moving after the last command,
					// so an image with one is never done redrawing.
					this.blinks = TelidonP5.hasBlink(this.commands);
					this.maxPoints = TelidonP5.maxPoints(this.commands);
					this.waitTimes = [];
					let t = 0;
					for (const cmd of this.commands) {
						if (cmd.type === "wait") {
							t += cmd.seconds || 0;
							this.waitTimes.push(t);
						}
					}
					this.waitIndex = 0;
					this.pointLimit = 0;
					this.startMillis = millis();
					this.finished = this.maxPoints === 0 && this.waitTimes.length === 0;
					this.render(0, 0);
				}

				advance(elapsed, elapsedMs) {
					let moved = false;
					const nextPointLimit = Math.min(
						this.maxPoints,
						Math.floor(Math.max(0, elapsedMs) / TelidonP5.PROGRESSIVE_DRAW_INTERVAL)
					);
					if (nextPointLimit !== this.pointLimit) {
						this.pointLimit = nextPointLimit;
						moved = true;
					}
					while (this.waitIndex < this.waitTimes.length && this.waitTimes[this.waitIndex] <= elapsed) {
						this.waitIndex++;
						moved = true;
					}
					if (this.pointLimit >= this.maxPoints && this.waitIndex >= this.waitTimes.length) {
						this.finished = true;
					}
					return moved;
				}

				render(elapsed, elapsedMs) {
					TelidonP5.render(this.pg, this.commands, {
						time: elapsed,
						blinkTime: elapsed,
						progressiveDraw: true,
						elapsed: elapsedMs
					});
				}

				draw() {
					const elapsedMs = millis() - this.startMillis;
					const elapsed = elapsedMs / 1000;
					// Only re-render when a new vertex is revealed, a WAIT
					// boundary is crossed, or palette blink is active.
					if (this.advance(elapsed, elapsedMs) || this.blinks) {
						this.render(elapsed, elapsedMs);
					}
					image(this.pg, 0, 0);
				}

				remove() {
					this.pg.remove();
				}

			}

			function clearTelidon() {
				if (player) {
					player.remove();
					player = null;
				}
			}


			function preload() {
			    isMobile = detectMobile();

			    //if (isMobile) 
			    //loadNewTelidon("./images/output_20260222_181752.nap");
			    loadLatestToken();
			}

			function setup() {
				// Scale the canvas to fill the window while preserving the
				// 640x480 aspect ratio (see grid/js/main.js for reference).
				scaleFactor = Math.min(windowWidth / sW, windowHeight / sH);
				c = createCanvas(sW * scaleFactor, sH * scaleFactor);
				c.id("main-canvas");

				// Render at 1x device pixels. On HiDPI/Retina the default density
				// (2+) would draw this large canvas at 4x the pixels for little
				// visible gain on the retro vector art. (grid/js/main.js does the same.)
				pixelDensity(1);

			    //if (!isMobile) setupGif();

				dropZone = document.getElementsByTagName("body")[0];
			    dropZone.addEventListener('dragover', onDragOver);
			    dropZone.addEventListener('drop', onDrop);
			    
			    defaultFont = loadFont("./files/fonts/Telidon-Bold/Telidon-Bold.ttf", function(font) {
			        textFont(font);
			        textSize(36);
			        textAlign(LEFT);        
			    });

			    //preview = document.getElementById("preview");
			    //setPreview("shark");
			    
			    /*
			    explanation = document.getElementById("explanation");
			    explanationbg = document.getElementById("explanation-bg");
			    explanation.addEventListener("click", function() {
			        explanation.style = "opacity: 0";
			        explanationbg.style = "opacity: 0";
			    });
			    */
				document.getElementById("latest").addEventListener("click", function() {
                    clearTelidon();
				    stopSlideshow();
				    loop(); // redraw now; loadLatestToken() re-loops when content arrives
			        loadLatestToken();
			    });

				document.getElementById("clear").addEventListener("click", function() {
                    clearTelidon();
				    stopSlideshow();
				    loop(); // redraw once to show the placeholder, then idle
			    });

			    // Start the slideshow (loading other content stops it).
			    document.getElementById("slideshow").addEventListener("click", function() {
			        startSlideshow();
			    });

			    // Initialise Tezos wallet and load latest on-chain token.
			    initTezos();

			    // Load the .nap manifest for slideshow mode (falls back to the
			    // hardcoded napFiles list if the fetch fails).
			    fetch("./images/nap-list.json")
			        .then(function(r) { return r.json(); })
			        .then(function(list) { if (Array.isArray(list) && list.length) napFiles = list; })
			        .catch(function() { /* keep fallback list */ });
			}

			function draw() {
			    // Drawing mode's overlay covers this canvas, so there is nothing
			    // to draw it for -- but a token that arrives from the chain while
			    // it is up would run its reveal behind the overlay, taking frame
			    // rate from drawing mode and CPU from the hand tracker. Leaving
			    // drawing mode calls loop() again.
			    if (liveDrawingActive) {
			        noLoop();
			        return;
			    }
				background(0);
			    if (!player) {
			        fill(255);
			        textAlign(CENTER);
			        text("\\\\ DRAG ' n ' DROP //", width/2, height/2);
			        textAlign(LEFT);
			        noLoop(); // idle placeholder is static; stop redrawing
			        return;
			    }

			    // Draw the 640x480 NAPLPS buffer scaled to fill the canvas.
			    push();
			    scale(scaleFactor);
			    player.draw();
			    pop();

			    // Once the drawing has fully revealed (and has no ongoing palette
			    // blink), the frame is static — stop the loop until new content arrives.
			    if (player.finished && !player.blinks) noLoop();

			    /*
			    if (!isMobile && recording && frameCount % 2 == 0) {
			        gif.addFrame(c.elt, {delay: 1, copy: true});
			    }

			    if (!isMobile && recording && telidon[telidon.length-1].finished) {
			        recording = false;
			        gif.render();
			    }
			    */
			}

			function windowResized() {
			    scaleFactor = Math.min(windowWidth / sW, windowHeight / sH);
			    resizeCanvas(sW * scaleFactor, sH * scaleFactor);
			    loop(); // redraw at the new size (re-idles once finished)
			}

			// Show the copy icon when dragging over.  Seems to only work for chrome.
			function onDragOver(e) {
			    e.stopPropagation();
			    e.preventDefault();
			    e.dataTransfer.dropEffect = 'copy';    
			}

			function onDrop(e) {
			    e.stopPropagation();
			    e.preventDefault();
			    let file = e.dataTransfer.files[0]; 
			    const fileNameArray = file.name.split(".");
			    const extension = fileNameArray[fileNameArray.length-1].toLowerCase();
		        let reader = new FileReader();

		        if (extension === "svg") {
		        	reader.onload = function(e2) {
		        		let div = document.createElement('div');
        				let element = new p5.SVGElement(div);
                		div.innerHTML = e2.target.result;
                		let svg = div.querySelector('svg');
                		element.elt = svg;

		        		setupSvg(element);
		        	}
		        	reader.readAsText(file, 'UTF-8');
		        } else {
		        	// NAPLPS is a byte stream, so it is read as bytes; decoding
		        	// it as text would fold anything above 0x7F into
		        	// replacement characters.
		        	reader.onload = function(e2) {
			            loadTelidonFromText(new Uint8Array(e2.target.result));
		        	}
		        	reader.readAsArrayBuffer(file);
		        }
			}

			// Start a new drawing. The decoder takes a Uint8Array or a string
			// of character codes, so both a dropped file and the text field can
			// be handed straight to it.
			function startTelidon(data) {
			    let next;
			    try {
			        next = new NapPlayer(data, sW, sH);
			    } catch (err) {
			        console.error("Couldn't decode NAPLPS input", err);
			        return;
			    }
			    clearTelidon();
			    player = next;
			    window.pendingNapRaw = data;
			    recording = true;
			    setSize(data.length);
			    loop(); // new content to animate — restart the draw loop
			}

			function loadTelidonFromText(input) {
				stopSlideshow(); // deliberate content load takes over from the slideshow
				startTelidon(input);
			}
			window.loadTelidonFromText = loadTelidonFromText;

			function onFormSubmit() {
				const field = document.getElementById("naplps_field");
				loadTelidonFromText(field.value);
			}

			function loadNewTelidon(fileName) { 
			    fetch(fileName).then(function(response) {
			        return response.arrayBuffer();
			    }).then(function(buffer) {
			        startTelidon(new Uint8Array(buffer));
			    }).catch(function(err) {
			        console.error("Couldn't load " + fileName, err);
			    });
			}

			// ── Slideshow mode ──

			function startSlideshow() {
			    if (liveDrawingActive || slideshowActive) return;
			    slideshowActive = true;
			    const link = document.getElementById("slideshow");
			    if (link) link.classList.add("active");
			    loadRandomNap();
			    slideshowPlayTimer = setInterval(function() {
			        if (liveDrawingActive) { stopSlideshow(); return; }
			        loadRandomNap();
			    }, slideshow_interval * 1000);
			}

			function stopSlideshow() {
			    slideshowActive = false;
			    const link = document.getElementById("slideshow");
			    if (link) link.classList.remove("active");
			    if (slideshowPlayTimer !== null) {
			        clearInterval(slideshowPlayTimer);
			        slideshowPlayTimer = null;
			    }
			}
			window.stopSlideshow = stopSlideshow;

			function loadRandomNap() {
			    if (!napFiles.length) return;
			    const file = napFiles[Math.floor(Math.random() * napFiles.length)];
			    loadNewTelidon("./images/" + file);
			}

			//function setPreview(name) {
			//    preview.style.backgroundImage = "url(./tools/rosetta_stone/cover/png/" + name + ".png)";
			//}

			function setupGif() {
			    gif = new GIF({
			        workers: 4,
			        workerScript: './js/libraries/gifjs/gif.worker.js', // https://github.com/jnordberg/gif.js/issues/59
			        quality: 40
			    });

			    gif.on('finished', function(blob) {
			        // https://developer.mozilla.org/en-US/docs/Web/API/HTMLMediaElement/srcObject
			        let img = document.createElement('img');
			        img.src = URL.createObjectURL(blob);
			        img.style = "width: " + sW/2 + "px; height: " + sH/2 + "px; position: absolute; left: " + posCounterX + "px; top: " + (posCounterY + sH + 29) + "px;";
			        posCounterX += sW/2;

			function detectMobile() {
			    if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|BB|PlayBook|IEMobile|Windows Phone|Kindle|Silk|Opera Mini/i.test(navigator.userAgent)) {
			        return true;
			    } else {
			        return false;
			    }
			}		

			// svg

			// SVG user units are y-down; the NAPLPS unit screen is y-up.
			// Coordinate operands span [-1, 1), so 1.0 itself has no encoding.
			function svgPoint(px, py, svgWidth, svgHeight) {
				return {
					x: clampUnit(px / svgWidth),
					y: clampUnit(UNIT_HEIGHT * (1 - (py / svgHeight)))
				};
			}

			function clampUnit(v) {
				return Math.max(0, Math.min(0.999, v));
			}

			// The encoder takes colors as fractions rather than as bytes.
			function svgColor(attr, fallback) {
				const rgb = hexToRgb(attr);
				if (!rgb) return fallback;
				return { r: rgb.r / 255, g: rgb.g / 255, b: rgb.b / 255 };
			}

			function setupSvg(ps) {
				let polylines, polygons, paths;
				let strokes = [];

				const white = { r: 1, g: 1, b: 1 };
				const black = { r: 0, g: 0, b: 0 };

			    let svgWidth = parseFloat(ps.attribute("width"));
			    let svgHeight = parseFloat(ps.attribute("height"));
			    if (!svgWidth || !svgHeight) {
			    	let vb = (ps.attribute("viewBox") || "").trim().split(/[\s,]+/);
			    	svgWidth  = vb.length >= 4 ? parseFloat(vb[2]) : 512;
			    	svgHeight = vb.length >= 4 ? parseFloat(vb[3]) : 512;
			    }

		    	// NAPLPS can only use a fill color or a stroke color in one path, not both.
				// fill-opacity, stroke-opacity, stroke-linecap, and stroke-width are not used.

			    polygons = ps.query('polygon');
				
			    for (let path of polygons) {
			    	let points = [];
			    	let color = white;
			    	let isFill = true;
			    	
					let strokeColorAttr = path.attribute("stroke"); // "#FEFEFE" or "none" 
			    	let fillColorAttr = path.attribute("fill"); // "#FEFEFE" or "none" 			
					
					if (fillColorAttr !== "none") {
						color = svgColor(fillColorAttr, white);
					} else if (fillColorAttr === "none" && strokeColorAttr !== "none") {
						color = svgColor(strokeColorAttr, white);
					}

			    	let pointsAttr = (path.attribute("points") || "").trim().split(/\s+/);
			    	for (let pointAttr of pointsAttr) {
			    		let pointAttrArray = pointAttr.split(",");
			    		if (pointAttrArray.length < 2) continue;
			    		points.push(svgPoint(parseFloat(pointAttrArray[0]), parseFloat(pointAttrArray[1]), svgWidth, svgHeight));
			    	}
					
					points = rdpSimplify(points, 0.02);

					if (points.length > 1) strokes.push({ color: color, points: points, isFill: isFill });
			    }

			    polylines = ps.query('polyline');

			    for (let path of polylines) {
			    	let points = [];
			    	let color = black;
			    	let isFill = false;
			    	
					let strokeColorAttr = path.attribute("stroke"); // "#FEFEFE" or "none" 
			    	let fillColorAttr = path.attribute("fill"); // "#FEFEFE" or "none" 
					
					if (strokeColorAttr === "none" && fillColorAttr !== "none") {
						color = svgColor(fillColorAttr, black);
					} else if (strokeColorAttr !== "none") {
						color = svgColor(strokeColorAttr, black);
					}

			    	let pointsAttr = (path.attribute("points") || "").trim().split(/\s+/);
			    	for (let pointAttr of pointsAttr) {
			    		let pointAttrArray = pointAttr.split(",");
			    		if (pointAttrArray.length < 2) continue;
			    		points.push(svgPoint(parseFloat(pointAttrArray[0]), parseFloat(pointAttrArray[1]), svgWidth, svgHeight));
			    	}
					
					points = rdpSimplify(points, 0.02);

					if (points.length > 1) strokes.push({ color: color, points: points, isFill: isFill });
			    }

			    paths = ps.query('path'); //ps.elt.querySelectorAll('path');

			    for (let path of paths) {
			    	let points = [];
			    	let color = white;
			    	let isFill = true;

			    	let fillColorAttr = path.attribute('fill') || 'none';
			    	let strokeColorAttr = path.attribute('stroke') || 'none';

			    	if (fillColorAttr !== 'none') {
			    		color = svgColor(fillColorAttr, white);
			    	} else if (fillColorAttr === 'none' && strokeColorAttr !== 'none') {
			    		isFill = false;
			    		color = svgColor(strokeColorAttr, white);
			    	}

			    	// Parse transform="translate(tx,ty)"
			    	let tx = 0, ty = 0;
			    	let transformAttr = path.attribute('transform');
			    	if (transformAttr) {
			    		let tMatch = /translate\(\s*(-?[\d.]+)\s*,\s*(-?[\d.]+)\s*\)/.exec(transformAttr);
			    		if (tMatch) { tx = parseFloat(tMatch[1]); ty = parseFloat(tMatch[2]); }
			    	}

			    	// Parse d attribute: M/L commands only (Z closes the path, no coords)
			    	let d = path.attribute('d') || '';
			    	let cmdRegex = /[ML]\s*(-?[\d.]+),(-?[\d.]+)/g;
			    	let m;
			    	while ((m = cmdRegex.exec(d)) !== null) {
			    		let px = parseFloat(m[1]) + tx;
			    		let py = parseFloat(m[2]) + ty;
			    		points.push(svgPoint(px, py, svgWidth, svgHeight));
			    	}

			    	points = rdpSimplify(points, 0.02); // default 0.005, higher = more simplification

			    	if (points.length > 1) {
			    		strokes.push({ color: color, points: points, isFill: isFill });
			    	}
			    }

				// Build the command array the encoder serialises: clear the
				// screen, then a color and a polygon for each shape.
				const commands = [{ type: "reset", screen: true, r: 0, g: 0, b: 0 }];
				for (let stroke of strokes) {
					commands.push({ type: "setColor", r: stroke.color.r, g: stroke.color.g, b: stroke.color.b });
					commands.push({ type: "polygon", points: stroke.points, filled: stroke.isFill });
				}

				const napRaw = NAPLPS.encode(commands);

				// download nap
				const _ts = new Date().toISOString().replace(/[-:]/g, '').replace('T', '_').split('.')[0];
				const _blob = new Blob([napRaw], { type: 'application/octet-stream' });
				const _url = URL.createObjectURL(_blob);
				const _a = document.createElement('a');
				_a.href = _url;
				_a.download = 'output_' + _ts + '.nap';
				_a.click();
				URL.revokeObjectURL(_url);

				// Expose encoded NAPLPS for the Tezos mint flow.
				window.pendingNapRaw = napRaw;
				console.log('[nap-xtz] SVG encoded to NAPLPS, length:', napRaw.length);
				const btnMint = document.getElementById('btn-mint');
				if (btnMint) btnMint.style.display = 'inline-block';
				if (typeof setStatus === 'function') setStatus('SVG encoded');

				loadTelidonFromText(napRaw);
			}

		function rdpSimplify(points, epsilon) {
			if (points.length <= 2) return points;
			let start = points[0], end = points[points.length - 1];
			let maxDist = 0, maxIdx = 0;
			for (let i = 1; i < points.length - 1; i++) {
				let dist = rdpPointLineDist(points[i], start, end);
				if (dist > maxDist) { maxDist = dist; maxIdx = i; }
			}
			if (maxDist > epsilon) {
				let left = rdpSimplify(points.slice(0, maxIdx + 1), epsilon);
				let right = rdpSimplify(points.slice(maxIdx), epsilon);
				return left.slice(0, -1).concat(right);
			}
			return [start, end];
		}

		function rdpPointLineDist(p, a, b) {
			let dx = b.x - a.x, dy = b.y - a.y;
			let lenSq = dx * dx + dy * dy;
			if (lenSq === 0) {
				dx = p.x - a.x; dy = p.y - a.y;
				return Math.sqrt(dx * dx + dy * dy);
			}
			let t = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / lenSq));
			dx = p.x - (a.x + t * dx); dy = p.y - (a.y + t * dy);
			return Math.sqrt(dx * dx + dy * dy);
		}
		window.rdpSimplify = rdpSimplify;

		function hexToRgb(hex) {
				let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
				return result ? {
					r: parseInt(result[1], 16),
					g: parseInt(result[2], 16),
					b: parseInt(result[3], 16)
				} : null;
			}

			function componentToHex(c) {
			  let hex = c.toString(16);
			  return hex.length == 1 ? "0" + hex : hex;
			}

			function rgbToHex(r, g, b) {
			  return "#" + componentToHex(r) + componentToHex(g) + componentToHex(b);
			}	
		</script>

	<body>

				<p>
					<b><a href="https://github.com/n1ckfg/Telidon/blob/master/js/telidon/TelidonP5.js">TelidonP5.js</a></b> allows NAPLPS vector graphics files to be displayed in a browser using <a href="https://p5js.org/">p5.js</a>. It depends on a companion encoder/decoder library <b><a href="https://github.com/n1ckfg/Telidon/blob/master/js/telidon/naplps.js">naplps.js</a></b> can also be used separately.
				</p>
				<p>
					August 15th, 2018 marked the 40th anniversary of the <a href="https://en.wikipedia.org/wiki/Telidon">Telidon</a> vector graphics workstation, launched in 1978. The Telidon hardware was discontinued in 1985, but its file format, standardized as <a href="https://en.wikipedia.org/wiki/NAPLPS">NAPLPS</a>, thrived and remained in wide use throughout the <a href="https://en.wikipedia.org/wiki/Bulletin_board_system">BBS</a> era, until the mid-1990s. Thanks to its exceptionally small file size and limited animation features, NAPLPS can be seen as a technological ancestor of the <a href="https://en.wikipedia.org/wiki/GIF#Animated_GIF">animated GIF</a> and the <a href="https://en.wikipedia.org/wiki/SWF">Flash SWF</a>&mdash;a new artistic medium that could be both produced and distributed on the same machine.
				</p>
				<p>
					From 1982&ndash;1985, members of the Toronto arts org <a href="http://interaccess.org/">InterAccess</a> used Telidon systems to produce an ambitious series of <a href="https://motherboard.vice.com/en_us/article/ezveak/the-original-net-artists">interactive BBS-based artworks</a> in the format.

		<!-- Drawing mode script -->
		<script type="module">
			import { startDrawingMode, stopDrawingMode } from './js/drawing/drawing.js';

			document.getElementById('btn-live-drawing').addEventListener('click', async () => {
				clearTelidon();
				liveDrawingActive = true; // block slideshow while drawing
				stopSlideshow();
				const container = document.getElementById('drawing-container');
				container.classList.add('active');
				await startDrawingMode(container);
			});

			// The Exit button and the double thumbs-up both leave this way, so
			// the main canvas's draw loop always starts again behind them.
			function exitDrawingMode() {
				stopDrawingMode();
				const container = document.getElementById('drawing-container');
				container.classList.remove('active');
				liveDrawingActive = false;
				loop(); // refresh the main canvas (handles exit with no strokes drawn)
			}
			window.exitDrawingMode = exitDrawingMode;

			document.getElementById('btn-exit-drawing').addEventListener('click', exitDrawingMode);
		</script>
